
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Card Quiz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #101044, #292980, #7546a8);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
}

.circle.one {
    width: 350px;
    height: 350px;
    top: -100px;
    left: -100px;
}

.circle.two {
    width: 250px;
    height: 250px;
    bottom: -70px;
    right: -50px;
}

.container {
    text-align: center;
    z-index: 1;
    padding: 40px 20px;
}

.logo {
    font-size: 55px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(40px, 8vw, 75px);
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffffff, #a9eaff, #ffd6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.cards {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 45px 0;
    perspective: 800px;
}

.card {
    width: 145px;
    height: 185px;
    border-radius: 18px;
    background: linear-gradient(145deg, #ffffff, #d9eaff);
    color: #29235f;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    transform: rotate(-9deg);
    transition: 0.4s;
}

.card:nth-child(2) {
    transform: translateY(-20px) rotate(0deg);
    background: linear-gradient(145deg, #ffe6a8, #ffb7d5);
}

.card:nth-child(3) {
    transform: rotate(9deg);
    background: linear-gradient(145deg, #d8fff0, #a9eaff);
}

.card:hover {
    transform: translateY(-15px) scale(1.08);
}

.start-btn {
    padding: 16px 48px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(90deg, #ffcf70, #ff8db5);
    color: #25194e;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,150,180,0.35);
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 35px rgba(255,150,180,0.55);
}
.settings-btn {
    position: fixed;
    top: 18px;
    right: 20px;
    z-index: 10;
    padding: 10px 16px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 15px;
    cursor: pointer;
}

.settings-btn:hover {
    background: rgba(255, 255, 255, 0.28);
}
footer {
    margin-top: 55px;
    font-size: 13px;
    color: #d5d2f5;
}

@media(max-width: 500px) {
    .card {
        width: 95px;
        height: 135px;
        font-size: 35px;
    }

    .cards {
        gap: 8px;
    }
}
.settings-link {
    position: fixed;
    top: 18px;
    right: 20px;
    z-index: 5;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    color: white;
    text-decoration: none;
    font-size: 21px;
    transition: 0.2s;
}

.settings-link:hover {
    transform: rotate(35deg);
    background: rgba(255, 255, 255, 0.24);
}

@media (max-width: 500px) {
    .settings-link {
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
    }
}
<link rel="stylesheet" href="./theme.css">
</style>

    <title>Flashcard App</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">

</head>

<body>
<a href="manage.html">
    <button class="settings-btn" type="button">⚙ Settings</button>
</a>
<div class="circle one"></div>
<div class="circle two"></div>

<div class="container">
    <div class="logo">🧠</div>

    <h1>FLASH CARD<br>QUIZ</h1>

    <div class="cards">
        <div class="card">📚</div>
        <div class="card">💡</div>
        <div class="card">🎯</div>
    </div>

    <button class="start-btn" onclick="startQuiz()">
        START QUIZ →
    </button>

    <footer>© 2026 FLASH CARD QUIZ</footer>
</div>

<script>
function startQuiz() {
    window.location.href = "quiz.html";
}

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
